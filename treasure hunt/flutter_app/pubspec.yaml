name: flutter_app
description: "The Echo Protocol — Team and Admin Web App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core:      ^3.6.0
  firebase_auth:      ^5.3.1
  cloud_firestore:    ^5.4.3
  cloud_functions:    ^4.7.3

  # Routing
  go_router:          ^14.6.1

  # Navigation to field app
  url_launcher:       ^6.3.1

  # State management
  provider:           ^6.1.2

  # Icons
  cupertino_icons:    ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

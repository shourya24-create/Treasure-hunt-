name: flutter_app
description: "The Echo Protocol — Team and Admin Web App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core:      ^3.6.0
  firebase_auth:      ^5.3.1
  cloud_firestore:    ^5.4.3
  cloud_functions:    ^5.1.3

  # Routing
  go_router:          ^14.6.1

  # Opens the scanner page (/field/scan)
  url_launcher:       ^6.3.1

  # State management
  provider:           ^6.1.2

  # Echo's chapter voice lines
  just_audio:         ^0.9.40

  # GPS of the team's one phone
  geolocator:         ^13.0.2

  # Admin map
  flutter_map:        ^7.0.2
  latlong2:           ^0.9.1

  # Remembers that this phone has passed the preflight check
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/textures/noise.png
    - assets/audio/test_tone.wav

  # Bundled, not fetched at runtime, so campus Wi-Fi can't break typography.
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

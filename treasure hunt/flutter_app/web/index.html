<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web` (see its --base-href option). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Team and control app for The Echo Protocol, the AR/VR club's campus mystery hunt.">

  <!-- bg-void (DESIGN_SYSTEM.md 2.1), for the browser's own chrome -->
  <meta name="theme-color" content="#0B0C0A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Echo Protocol">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Echo Protocol</title>
  <link rel="manifest" href="manifest.json">

  <!-- bg-void while the app loads, so a phone in the dark room never flashes white -->
  <style>
    html, body { background-color: #0B0C0A; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
